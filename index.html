<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Mario Maker–Style Level Editor</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a1a2e;
        overflow: hidden;
        /* Stop the browser from turning taps on the on-screen game
           controls into scroll/pinch/double-tap-zoom gestures. */
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
