name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/mario-maker-editor-plan-cgyxrl
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Priority Matrix (Reliability & testing process, Tier 2): promotes the
  # Playwright scripts every feature this project shipped was verified by
  # (previously hand-written from scratch each time, never checked in) into
  # this committed, CI-run suite — see tests/e2e/ and its own support/
  # helpers (a from-scratch mocked Google Drive/auth backend, so this never
  # touches a real Google account). Runs independently of `build` (it
  # drives its own `npm run dev` instance via playwright.config.ts's
  # webServer, not the production bundle `build` produces) so both can run
  # in parallel; `deploy` below waits on both.
  # Sharded across three runners because this job gates the deploy and had
  # grown to ~53 minutes at 171 tests. Each shard is a separate machine
  # running its own third of the suite, and every one of them keeps
  # playwright.config.ts's `workers: 1` — so this is three machines doing a
  # third each, not one machine running three tests at once. That
  # distinction is the whole point: the timing-sensitive physics specs never
  # share a CPU with anything.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # Keeps every shard running when one fails, so a red run reports all
      # of its failures at once instead of one per push.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Named per shard: three jobs uploading "playwright-report" would
          # collide, and upload-artifact v4 rejects a duplicate name rather
          # than merging.
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
