name: Build TheXTech

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libsdl2-dev libsdl2-mixer-dev libfreeimage-dev

      - name: Configure
        run: cmake -S TheXTech -B TheXTech/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build TheXTech/build

      - name: Smoke test
        run: TheXTech/build/output/bin/thextech --version
